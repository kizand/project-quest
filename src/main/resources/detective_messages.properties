q1.text=Вы - известный детектив. Вас вызывают на место убийства миллионера. С чего начнете?
q1.answer1=Осмотреть тело
q1.answer2=Поговорить с прислугой

q2.text=На теле найдены странные следы укуса. Похоже на вампира!
q2.answer1=Искать вампира
q2.answer2=Искать другие улики

q3.text=Прислуга говорит, что видели таинственного незнакомца в плаще.
q3.answer1=Искать незнакомца
q3.answer2=Проверить комнату убитого

q4.text=Вы находите логово вампира в подвале!
q4.answer1=Войти с распятием
q4.answer2=Войти с колом

q5.text=В комнате убитого найден дневник с зашифрованными записями.
q5.answer1=Расшифровать записи
q5.answer2=Показать эксперту

q6.text=Незнакомец оказывается братом убитого. Он предлагает взятку, чтобы вы закрыли дело.
q6.answer1=Взять взятку
q6.answer2=Арестовать его

q7.text=Вампир боится распятия. Вы заставляете его признаться в убийстве!
q7.answer1=Начать заново
q7.answer2=Выбрать другой квест
q7.victory=Дело раскрыто! Убийца - вампир, и он обезврежен!
q7.difficulty=5

q8.text=Кол оказался недостаточно острым. Вампир атакует...
q8.answer1=Начать заново
q8.answer2=Выбрать другой квест
q8.defeat=Вампир убивает вас. Дело остается нераскрытым.
q8.difficulty=5

q9.text=В дневнике зашифровано имя убийцы - это дворецкий!
q9.answer1=Начать заново
q9.answer2=Выбрать другой квест
q9.victory=Дворецкий арестован! Дело раскрыто!
q9.difficulty=5

q10.text=Эксперт теряет улики. Дело закрыто из-за отсутствия доказательств.
q10.answer1=Начать заново
q10.answer2=Выбрать другой квест
q10.defeat=Убийца остается на свободе. Дело провалено.
q10.difficulty=5

q11.text=Взятка оказывается фальшивой, и вас арестовывают за коррупцию.
q11.answer1=Начать заново
q11.answer2=Выбрать другой квест
q11.defeat=Вы в тюрьме, а убийца на свободе.
q11.difficulty=5

q12.text=Брат убийцы сознается в преступлении из ревности!
q12.answer1=Начать заново
q12.answer2=Выбрать другой квест
q12.victory=Преступник сознался! Дело раскрыто!
q12.difficulty=5

quest.title=Детективная история
quest.description=Раскройте убийство миллионера в старом особняке. Под подозрением все: и родственники, и прислуга!