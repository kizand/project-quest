q1.text=Вы стоите перед входом в заброшенный замок. Ночь, луна освещает древние стены. Что вы сделаете?
q1.answer1=Войти через главный вход
q1.answer2=Найти тайный вход

q2.text=Вы входите в главный зал. Слышен странный шорох. На стене висит старый меч.
q2.answer1=Взять меч и исследовать звук
q2.answer2=Игнорировать меч и пойти дальше

q3.text=Вы нашли потайную дверь за кустами. Она ведет в подвал замка.
q3.answer1=Спуститься в подвал
q3.answer2=Вернуться к главному входу

q4.text=Вы взяли меч и пошли на звук. Это оказался призрак старого рыцаря!
q4.answer1=Сразиться с призраком
q4.answer2=Попытаться поговорить

q5.text=Вы пошли дальше без оружия. В темноте вы слышите шаги...
q5.answer1=Спрятаться
q5.answer2=Бежать

q6.text=В подвале вы нашли сундук с сокровищами! Но вход завалило камнями.
q6.answer1=Попытаться разобрать завал
q6.answer2=Искать другой выход

q7.text=Вы победили призрака! Он рассыпался в прах, оставив после себя древний амулет.
q7.answer1=Начать заново
q7.answer2=Выбрать другой квест
q7.victory=Вы нашли древний амулет и выбрались из замка! Сокровища ваши!
q7.difficulty=3

q8.text=Призрак оказался дружелюбным! Он показал вам тайный ход к сокровищам.
q8.answer1=Начать заново
q8.answer2=Выбрать другой квест
q8.victory=Вы нашли золото и подружились с призраком! Победа!
q8.difficulty=3

q9.text=Вы спрятались, но это был всего лишь кот. Вы нашли выход с мешком монет!
q9.answer1=Начать заново
q9.answer2=Выбрать другой квест
q9.victory=Вы нашли сокровища и благополучно выбрались!
q9.difficulty=3

q10.text="Вы побежали и упали в яму с водой. Выбраться не удалось...
q10.answer1=Начать заново
q10.answer2=Выбрать другой квест
q10.defeat=Вы утонули в подземной реке. Игра окончена.
q10.difficulty=3

q11.text="Вы разобрали завал, но камни упали и придавили вас...
q11.answer1=Начать заново
q11.answer2=Выбрать другой квест
q11.defeat=Вы погибли под завалом. Игра окончена.
q11.difficulty=3

q12.text=Вы нашли старый туннель, ведущий прямо к выходу! Сокровища ваши!
q12.answer1=Начать заново
q12.answer2=Выбрать другой квест
q12.victory=Вы нашли выход с сокровищами! Поздравляем!
q12.difficulty=3

quest.title=Поиск сокровищ в замке
quest.description=Отправляйтесь в заброшенный замок на поиски легендарных сокровищ. Вас ждут встречи с призраками, ловушки и загадочные подземелья.