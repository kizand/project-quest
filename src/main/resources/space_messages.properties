q1.text=Ваш космический корабль потерпел крушение на неизвестной планете. Что делать?
q1.answer1=Исследовать поверхность
q1.answer2=Попытаться починить корабль

q2.text=Вы выходите на поверхность. Видите странные сооружения вдалеке.
q2.answer1=Направиться к сооружениям
q2.answer2=Вернуться к кораблю

q3.text=Ремонт корабля требует редких кристаллов. Они есть в пещере неподалеку.
q3.answer1=Идти в пещеру
q3.answer2=Продолжить ремонт без кристаллов

q4.text=Вы находите заброшенную базу пришельцев. Там есть топливо!
q4.answer1=Взять топливо
q4.answer2=Поискать что-то еще

q5.text=В пещере вы находите кристаллы, но просыпается огромный паук!
q5.answer1=Сражаться с пауком
q5.answer2=Убегать

q6.text=Без кристаллов двигатель взрывается...
q6.answer1=Начать заново
q6.answer2=Выбрать другой квест
q6.defeat=Корабль уничтожен. Вы погибли.

q7.text=С топливом вы взлетаете и возвращаетесь на Землю!
q7.answer1=Начать заново
q7.answer2=Выбрать другой квест
q7.victory=Вы успешно вернулись на Землю и стали героем!

q8.text=Вы натыкаетесь на ловушку и попадаете в плен к пришельцам.
q8.answer1=Начать заново
q8.answer2=Выбрать другой квест
q8.defeat=Вас взяли в плен. Игра окончена.

q9.text=Вы победили паука и взяли кристаллы. Корабль починен!
q9.answer1=Начать заново
q9.answer2=Выбрать другой квест
q9.victory=Вы починили корабль и улетели домой! Победа!

q10.text=Паук догоняет вас и...
q10.answer1=Начать заново
q10.answer2=Выбрать другой квест
q10.defeat=Паук оказался быстрее. Вы погибли.

quest.title=Космическое приключение
quest.description=Вы капитан космического корабля, потерпевшего крушение на неизвестной планете. Сможете ли вы выжить и вернуться домой?


